<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Panel del Realizador</title>

<style>

body{
margin:0;
font-family:Arial;
}

.toolbar{
padding:10px;
background:#222;
color:white;
}

button{
padding:10px;
margin-right:10px;
}

#canvas{
height:calc(100vh - 60px);
background:#f5f5f5;
position:relative;
overflow:hidden;
}

.text-item{
position:absolute;
cursor:move;
font-weight:bold;
user-select:none;
}

.selected{
outline:2px dashed #00aaff;
}

</style>

</head>

<body>

<div class="toolbar">

<button id="nuevoTexto">
+ Texto
</button>

<button id="nuevaImagen">
+ Imagen
</button>

<button id="nuevoGif">
🎞 GIF
</button>

<button id="nuevoVideo">
🎥 Vídeo
</button> 

<button id="toggleVisible">
👁 Mostrar/Ocultar
</button>

<button id="eliminarElemento">
🗑 Eliminar
</button> 

<input type="color" id="color" value="#ff0000">
  
</div>

<div id="canvas"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {
getFirestore,
doc,
setDoc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAzJT8QDjb7nBjvN_YGWTXUUI3zU__lfdk",
authDomain: "obs-realizador.firebaseapp.com",
projectId: "obs-realizador",
storageBucket: "obs-realizador.firebasestorage.app",
messagingSenderId: "1034928961680",
appId: "1:1034928961680:web:3c785128a4b33a61c2c015"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let items=[];
let selectedId=null;

const canvas =
document.getElementById("canvas");

async function guardar(){

await setDoc(
doc(db,"overlay","main"),
{
items
}
);

}

document.getElementById("nuevoTexto")
.onclick = async ()=>{

const id =
Date.now().toString();

items.push({
id,
type:"text",
text:"Nuevo texto",
x:100,
y:100,
size:72,
color:"#ff0000",
visible:true,
rotation:0
});

selectedId=id;

await guardar();

};

document.getElementById("nuevaImagen")
.onclick = async ()=>{

const url =
prompt("Pega la URL de la imagen");

if(!url) return;

const id =
Date.now().toString();

items.push({
id,
type:"image",
url:url,
x:200,
y:200,
width:300,
visible:true,
rotation:0
});

selectedId=id;

await guardar();

};

document.getElementById("nuevoGif")
.onclick = async ()=>{

const url =
prompt("Pega la URL del GIF");

if(!url) return;

const id =
Date.now().toString();

items.push({
id,
type:"gif",
url:url,
x:200,
y:200,
width:300,
visible:true,
rotation:0  
});

selectedId=id;

await guardar();

};

document.getElementById("nuevoVideo")
.onclick = async ()=>{

const url =
prompt("Pega la URL del vídeo");

if(!url) return;

const id =
Date.now().toString();

let finalUrl = url;

if(url.includes("youtube.com/watch?v=")){

const videoId =
url.split("watch?v=")[1].split("&")[0];

finalUrl =
"https://www.youtube.com/embed/" +
videoId;

}

else if(url.includes("youtu.be/")){

const videoId =
url.split("youtu.be/")[1].split("?")[0];

finalUrl =
"https://www.youtube.com/embed/" +
videoId;

}

else if(url.includes("tiktok.com")){

finalUrl =
"https://www.tiktok.com/embed/v2/" +
url.split("/video/")[1]?.split("?")[0];

}

if(
url.toLowerCase().endsWith(".mp4") ||
url.toLowerCase().includes(".mp4?")
){

items.push({
id,
type:"video",
url:url,
x:200,
y:200,
width:600,
visible:true,
rotation:0  
});

}else{

items.push({
id,
type:"embed",
url:finalUrl,
x:200,
y:200,
width:600,
height:400,
visible:true,
rotation:0  
});

}

selectedId=id;

await guardar();

};

document.getElementById("eliminarElemento")
.onclick = async ()=>{

if(!selectedId) return;

items = items.filter(
item => item.id !== selectedId
);

selectedId = null;

await guardar();

};  

document.getElementById("color")
.oninput = async (e)=>{

if(!selectedId) return;

const item =
items.find(i => i.id === selectedId);

if(!item) return;

if(item.type !== "text") return;

console.log("color",e.target.value);

item.color =
e.target.value;

await guardar();

};

document.getElementById("toggleVisible")
.onclick = async ()=>{

if(!selectedId) return;

const item =
items.find(i => i.id === selectedId);

if(!item) return;

item.visible = !item.visible;

await guardar();

};

let redimensionando = false; 
let moviendo = false;  
  
onSnapshot(
doc(db,"overlay","main"),
(snapshot)=>{

if(redimensionando || moviendo){
return;
}

const data =
snapshot.data();

if(!data) return;

items =
data.items || [];

render();

}
);


function render(){

canvas.innerHTML="";

canvas.style.background="#f5f5f5";

items.forEach(item=>{

let element;

if(item.type==="text"){

element =
document.createElement("div");

element.className="text-item";

element.style.background =
"rgba(255,255,255,0.4)";

element.innerText=item.text;

element.style.color =
item.color || "#ff0000";

element.style.fontSize=item.size+"px";

}

if(item.type==="image"){

const wrapper =
document.createElement("div");

wrapper.style.display = "inline-block";
wrapper.style.lineHeight = "0";
wrapper.style.cursor = "move";
wrapper.style.width =
(item.width || 300)+"px";

const img =
document.createElement("img");

img.draggable = false;
img.style.pointerEvents = "none";

img.src = item.url;

img.style.width =
(item.width || 300)+"px";

img.style.height="auto";

img.style.border =
"none";

img.style.cursor =
"move";

wrapper.appendChild(img);

element = wrapper;

}

if(item.type==="gif"){

const wrapper =
document.createElement("div");

wrapper.style.display = "inline-block";
wrapper.style.lineHeight = "0";
wrapper.style.cursor = "move";
wrapper.style.width =
(item.width || 300)+"px";

const img =
document.createElement("img");

img.draggable = false;
img.style.pointerEvents = "none";

img.src = item.url;

img.style.width =
(item.width || 300)+"px";

img.style.height="auto";

img.style.border =
"none";

img.style.cursor =
"move";

wrapper.appendChild(img);

element = wrapper;

}

if(item.type==="embed"){

element =
document.createElement("iframe");

element.src =
item.url;

element.width =
item.width || 600;

element.height =
item.height || 400;

element.style.border =
"2px solid red";

element.style.cursor =
"move";

}

if(!element) return;


if(item.visible === false){

element.style.opacity = "0.2";

}

if(selectedId===item.id && !redimensionando){

element.classList.add("selected");
  
if(item.type==="text"){

document.getElementById("color").value =
item.color || "#ff0000";

}  

} 

if(
selectedId===item.id &&
!redimensionando &&
(
item.type==="text" ||
item.type==="image" ||
item.type==="gif"
)
){

const resizeHandle =
document.createElement("div");
  
resizeHandle.style.position = "absolute";
resizeHandle.style.width = "18px";
resizeHandle.style.height = "18px";
resizeHandle.style.right = "-12px";
resizeHandle.style.bottom = "-12px";
resizeHandle.style.background = "#00aaff";
resizeHandle.style.border = "2px solid white";
resizeHandle.style.borderRadius = "50%";
resizeHandle.style.cursor = "nwse-resize";
resizeHandle.style.zIndex = "9999";

element.appendChild(resizeHandle);

let ultimoGuardado = 0;

resizeHandle.onmousedown = (e)=>{

redimensionando = true;

e.stopPropagation();

const startX = e.clientX; 
const startY = e.clientY;

const startWidth =
item.width || 300;

const startSize =
item.size || 72;

const startRotation =
item.rotation || 0;  

function resize(ev){

const dx =
ev.clientX - startX;

const dy =
ev.clientY - startY;

if(
item.type==="image" ||
item.type==="gif"
){

item.width =
Math.max(
50,
startWidth + dx
);

const img =
element.querySelector("img");

if(img){

img.style.width =
item.width + "px";

element.style.width =
item.width + "px";

element.style.height =
img.offsetHeight + "px";

}

}

if(item.type==="text"){

item.size =
Math.max(
10,
startSize + dx / 2
);

element.style.fontSize =
item.size + "px";

item.rotation =
(startRotation || 0) + (dy * 0.5);

element.style.transform =
"rotate(" +
item.rotation +
"deg)";  

}

const ahora = Date.now();

if(ahora - ultimoGuardado > 30){

ultimoGuardado = ahora;

guardar();

}

}
  
async function stopResize(){

document.removeEventListener(
"mousemove",
resize
);

document.removeEventListener(
"mouseup",
stopResize
);

redimensionando = false;

await guardar();

}

document.addEventListener(
"mousemove",
resize
);

document.addEventListener(
"mouseup",
stopResize
);

};

}  
  
element.style.position="absolute";
element.style.left=item.x+"px";
element.style.top=item.y+"px";
element.style.overflow="visible";
 
element.onclick=(e)=>{

e.stopPropagation();

selectedId=item.id;

render();

};


if(item.type==="text"){

element.ondblclick=async ()=>{

const nuevo=
prompt("Texto",item.text);

if(nuevo!==null){

item.text=nuevo;

await guardar();

}

};

}

let startX,startY,startLeft,startTop;

element.onmousedown=(e)=>{

e.stopPropagation();  
  
moviendo = true;

selectedId=item.id;

startX=e.clientX;
startY=e.clientY;

startLeft=item.x;
startTop=item.y;

function move(ev){

item.x=
startLeft+(ev.clientX-startX);

item.y=
startTop+(ev.clientY-startY);

element.style.left=
item.x+"px";

element.style.top=
item.y+"px";

const ahora = Date.now();

if(!window.ultimoGuardadoMove){
window.ultimoGuardadoMove = 0;
}

if(ahora - window.ultimoGuardadoMove > 30){

window.ultimoGuardadoMove = ahora;

guardar();

}

}

async function stop(){

document.removeEventListener(
"mousemove",
move
);

document.removeEventListener(
"mouseup",
stop
);

moviendo = false;  
 
await guardar();

}

document.addEventListener(
"mousemove",
move
);

document.addEventListener(
"mouseup",
stop
);

};

canvas.appendChild(element);

});

}

</script>

</body>
</html>
