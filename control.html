<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Panel del Realizador</title>

<style>

body{
margin:0;
font-family:Arial;
}

.toolbar{
padding:10px;
background:#222;
color:white;
}

button{
padding:10px;
margin-right:10px;
}

#canvas{
height:calc(100vh - 60px);
background:#f5f5f5;
position:relative;
overflow:hidden;
}

.text-item{
position:absolute;
cursor:move;
font-weight:bold;
user-select:none;
}

.selected{
outline:2px dashed #00aaff;
}

</style>

</head>

<body>

<div class="toolbar">

<button id="nuevoTexto">
+ Texto
</button>

<input type="color" id="color" value="#ff0000">

<input type="range"
id="size"
min="20"
max="200"
value="72">

</div>

<div id="canvas"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {
getFirestore,
doc,
setDoc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAzJT8QDjb7nBjvN_YGWTXUUI3zU__lfdk",
authDomain: "obs-realizador.firebaseapp.com",
projectId: "obs-realizador",
storageBucket: "obs-realizador.firebasestorage.app",
messagingSenderId: "1034928961680",
appId: "1:1034928961680:web:3c785128a4b33a61c2c015"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let items=[];
let selectedId=null;

const canvas =
document.getElementById("canvas");

async function guardar(){

await setDoc(
doc(db,"overlay","main"),
{
items
}
);

}

document.getElementById("nuevoTexto")
.onclick = async ()=>{

const id =
Date.now().toString();

items.push({
id,
type:"text",
text:"Nuevo texto",
x:100,
y:100,
size:72,
color:"#ff0000"
});

selectedId=id;

await guardar();

};

document.getElementById("color")
.oninput = async (e)=>{

if(!selectedId) return;

const item =
items.find(i=>i.id===selectedId);

item.color=e.target.value;

await guardar();

};

document.getElementById("size")
.oninput = async (e)=>{

if(!selectedId) return;

const item =
items.find(i=>i.id===selectedId);

item.size=
Number(e.target.value);

await guardar();

};

onSnapshot(
doc(db,"overlay","main"),
(snapshot)=>{

const data =
snapshot.data();

if(!data) return;

items =
data.items || [];

render();

}
);

function render(){

canvas.innerHTML="";

items.forEach(item=>{

if(item.type!=="text") return;

const div =
document.createElement("div");

div.className="text-item";

if(selectedId===item.id){
div.classList.add("selected");
}

div.innerText=item.text;

div.style.left=item.x+"px";
div.style.top=item.y+"px";
div.style.color=item.color;
div.style.fontSize=item.size+"px";

div.onclick=()=>{

selectedId=item.id;

render();

};

div.ondblclick=async ()=>{

const nuevo=
prompt("Texto",item.text);

if(nuevo!==null){

item.text=nuevo;

await guardar();

}

};

let startX,startY,startLeft,startTop;

div.onmousedown=(e)=>{

selectedId=item.id;

startX=e.clientX;
startY=e.clientY;

startLeft=item.x;
startTop=item.y;

function move(ev){

item.x=
startLeft+(ev.clientX-startX);

item.y=
startTop+(ev.clientY-startY);

div.style.left=
item.x+"px";

div.style.top=
item.y+"px";

}

async function stop(){

document.removeEventListener(
"mousemove",
move
);

document.removeEventListener(
"mouseup",
stop
);

await guardar();

}

document.addEventListener(
"mousemove",
move
);

document.addEventListener(
"mouseup",
stop
);

};

canvas.appendChild(div);

});

}

</script>

</body>
</html>
