<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">  
<title>Panel del Realizador</title>

<style>

body{
margin:0;
font-family:Arial;

overflow:hidden;  
}

.toolbar{
padding:10px;
background:#222;
color:white;
}

button{
padding:10px;
margin-right:10px;
}

#workspace{
height:calc(100vh - 60px);
background:#ccc;
overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

position:relative;
}


#canvas{
position:relative;
z-index:5;
width:1920px;
height:1080px;
left:190;
top:160;
}

#drawLayer{
position:absolute;
left:190px;
top:160px;
width:1920px;
height:1080px;
pointer-events:none;
z-index:100;
}  

#safeArea{
position:absolute;

left:190px;
top:160px;

width:1920px;
height:1080px;

border:4px solid red;

pointer-events:none;

box-sizing:border-box;

z-index:1;
  
}

#twitch-embed{
position:absolute;

left:190px;
top:160px;

width:1920px;
height:1080px;

overflow:hidden;

z-index:0;

pointer-events:none;  
}
  
#youtubeFrame{
position:absolute;

left:0;
top:0;

width:100%;
height:100%;

border:none;

pointer-events:none;  
}

#editorArea{
zoom:0.50; 

width:2300px;
height:1400px;

position:absolute;

left:50%;
top:50%;

transform:translate(-50%,-50%);
 
}
  
.text-item{
position:absolute;
cursor:move;
font-weight:bold;
user-select:none;
display:inline-block;
transform-origin:center center;
white-space:nowrap;
}

.selected{
outline:2px dashed #00aaff;
}

*{
user-select:none;
-webkit-user-select:none;
}



</style>

</head>

<body>

<div class="toolbar">

<button id="selectMode">
🖱 Seleccionar
</button>    

<span style="margin-left:100px;"></span>     

<button id="nuevaImagen">
+ Imagen
</button>

<button id="nuevoGif">
🎞 GIF
</button>

<button id="nuevoVideo">
🎥 Vídeo
</button> 

<button id="nuevoTexto">
+ Texto
</button>

<input type="color" id="color" value="#ff0000">   

<button id="toggleVisible">
👁 Mostrar/Ocultar
</button>

<button id="eliminarElemento">
🗑 Eliminar
</button>  

<span style="margin-left:100px;"></span>  

<button id="drawMode">
🎨 Dibujar
</button>  

<input
type="color"
id="drawColor"
value="#ff0000">  

<button id="eraserMode">
🩹 Borrador
</button>

<button id="clearDraw">
🗑 Limpiar dibujo
</button>  

  
</div>

<div id="workspace">

  <div id="editorArea">
  
    <div id="safeArea"></div>

    <div id="twitch-embed">

 <iframe
id="youtubeFrame"
src="about:blank"
allow="autoplay; fullscreen"
allowfullscreen>
</iframe>

  </div>

    <div id="canvas"></div>

    <canvas id="drawLayer"></canvas>

  </div>

  </div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabaseUrl =
"https://dzbxgfxtdijdzrfophow.supabase.co";

const supabaseKey =
"sb_publishable_w--FJvX0mYUZoeraWkQkUg_xAF8e5tR";

const supabase =
createClient(
supabaseUrl,
supabaseKey
);

let items=[];
let selectedId=null;

const drawLayer =
document.getElementById("drawLayer");

drawLayer.width = 1920;
drawLayer.height = 1080;

const ctx =
drawLayer.getContext("2d");

let drawMode = false;
let eraserMode = false;
let drawing = false;  
let drawData = [];  

const canvas =
document.getElementById("canvas");

const EDITOR_SCALE = 0.50;  

async function guardar(){

const { error } =
await supabase
.from("overlay")
.update({
data: { items }
})
.eq("id","main");

if(error){
console.error(error);
}

}

document.getElementById("nuevoTexto")
.onclick = async ()=>{

const id =
Date.now().toString();

items.push({
id,
type:"text",
text:"Nuevo texto",
x:100,
y:100,
size:72,
color:"#ff0000",
visible:false,
rotation:0
});

selectedId=id;

await guardar();

};

document.getElementById("nuevaImagen")
.onclick = async ()=>{

const url =
prompt("Pega la URL de la imagen");

if(!url) return;

const id =
Date.now().toString();

items.push({
id,
type:"image",
url:url,
x:200,
y:200,
width:300,
visible:false,
rotation:0
});

selectedId=id;

await guardar();

};

document.getElementById("nuevoGif")
.onclick = async ()=>{

const url =
prompt("Pega la URL del GIF");

if(!url) return;

const id =
Date.now().toString();

items.push({
id,
type:"gif",
url:url,
x:200,
y:200,
width:300,
visible:false,
rotation:0  
});

selectedId=id;

await guardar();

};

document.getElementById("nuevoVideo")
.onclick = async ()=>{

const url =
prompt("Pega una URL de YouTube");

if(!url) return;

const id =
Date.now().toString();

let videoId = null;

if(url.includes("youtube.com/watch?v=")){

videoId =
url.split("watch?v=")[1]
.split("&")[0];

}

else if(url.includes("youtu.be/")){

videoId =
url.split("youtu.be/")[1]
.split("?")[0];

}

else if(url.includes("youtube.com/shorts/")){

videoId =
url.split("/shorts/")[1]
.split("?")[0];

}

if(!videoId){

alert(
"Solo se admiten URLs de YouTube por ahora"
);

return;

}

items.push({

id,

type:"embed",

url:
"https://www.youtube.com/embed/" +
videoId +
"?autoplay=1&mute=1&playsinline=1",

x:200,
y:200,

width:600,
height:400,

visible:false,

rotation:0

});

selectedId = id;

await guardar();

};

document.getElementById("eliminarElemento")
.onclick = async ()=>{

if(!selectedId) return;

items = items.filter(
item => item.id !== selectedId
);

selectedId = null;

await guardar();

};  

document.getElementById("color")
.oninput = async (e)=>{

if(!selectedId) return;

const item =
items.find(i => i.id === selectedId);

if(!item) return;

if(item.type !== "text") return;

item.color =
e.target.value;

await guardar();

};

document.getElementById("toggleVisible")
.onclick = async ()=>{

if(!selectedId) return;

const item =
items.find(i => i.id === selectedId);

if(!item) return;

item.visible = !item.visible;

await guardar();

};

document.getElementById("drawMode")
.onclick = ()=>{

drawMode = true;
eraserMode = false;

drawLayer.style.pointerEvents =
"auto";

};  

document.getElementById("selectMode")
.onclick = ()=>{

drawMode = false;
eraserMode = false;

drawLayer.style.pointerEvents =
"none";

};  

document.getElementById("eraserMode")
.onclick = ()=>{

drawMode = false;
eraserMode = true;

drawLayer.style.pointerEvents =
"auto";

};  

document.getElementById("clearDraw")
.onclick = async ()=>{

ctx.clearRect(
0,
0,
drawLayer.width,
drawLayer.height
);

drawData = [];

const { error } =
await supabase
.from("overlay")
.update({
data:{
items,
drawData
}
})
.eq("id","main");

if(error){
console.error(error);
}

};

drawLayer.onmousedown = (e)=>{

drawing = true;

drawData.push({
newStroke:true
});

ctx.beginPath();

ctx.moveTo(
e.offsetX / EDITOR_SCALE,
e.offsetY / EDITOR_SCALE
);

};

drawLayer.onmousemove = (e)=>{

if(!drawing) return;

if(eraserMode){

ctx.globalCompositeOperation =
"destination-out";

ctx.lineWidth = 30;

}else{

ctx.globalCompositeOperation =
"source-over";

ctx.strokeStyle =
document.getElementById(
"drawColor"
).value;

ctx.lineWidth = 5;

}

ctx.lineCap = "round";

ctx.lineTo(
e.offsetX / EDITOR_SCALE,
e.offsetY / EDITOR_SCALE
);

drawData.push({
x:e.offsetX / EDITOR_SCALE,
y:e.offsetY / EDITOR_SCALE,
color:eraserMode
? "eraser"
: document.getElementById("drawColor").value,
size:eraserMode ? 30 : 5
});

ctx.stroke();

const ahora = Date.now();

if(!window.ultimoGuardadoDraw){
window.ultimoGuardadoDraw = 0;
}

if(ahora - window.ultimoGuardadoDraw > 100){

window.ultimoGuardadoDraw = ahora;

supabase
.from("overlay")
.update({
data:{
items,
drawData
}
})
.eq("id","main");

}

};

document.addEventListener(
"mouseup",
async ()=>{

if(!drawing) return;

drawing = false;

const { error } =
await supabase
.from("overlay")
.update({
data:{
items,
drawData
}
})
.eq("id","main");

if(error){
console.error(error);
}

}
);

let redimensionando = false; 
let moviendo = false;  
  
async function cargar(){

const { data, error } =
await supabase
.from("overlay")
.select("*")
.eq("id","main")
.single();

if(error){
console.error(error);
return;
}

  
items =
data.data.items || [];

drawData =
data.data.drawData || [];  

render();

}

cargar();

supabase
.channel('overlay-changes')
.on(
'postgres_changes',
{
event: 'UPDATE',
schema: 'public',
table: 'overlay'
},
(payload) => {

console.log("UPDATE LLEGADO");

if(redimensionando || moviendo){
return;
}

cargar();

}
)
.subscribe();

function render(){

canvas.innerHTML = ""; 

canvas.style.background="transparent";

items.forEach(item=>{

let element;

if(item.type==="text"){

element =
document.createElement("div");

element.className="text-item";

element.style.display = 
"inline-block";  

element.style.background =
"rgba(255,255,255,0.4)";

element.innerText=item.text;

element.style.color =
item.color || "#ff0000";

element.style.fontSize=item.size+"px";

}

if(item.type==="image"){

const wrapper =
document.createElement("div");

wrapper.style.display = "inline-block";
wrapper.style.lineHeight = "0";
wrapper.style.cursor = "move";
wrapper.style.width =
(item.width || 300)+"px";

const img =
document.createElement("img");

img.draggable = false;
img.style.pointerEvents = "none";

img.src = item.url;

img.style.width =
(item.width || 300)+"px";

img.style.height="auto";

img.style.border =
"none";

img.style.cursor =
"move";

wrapper.appendChild(img);

element = wrapper;

}

if(item.type==="gif"){

const wrapper =
document.createElement("div");

wrapper.style.display = "inline-block";
wrapper.style.lineHeight = "0";
wrapper.style.cursor = "move";
wrapper.style.width =
(item.width || 300)+"px";

const img =
document.createElement("img");

img.draggable = false;
img.style.pointerEvents = "none";

img.src = item.url;

img.style.width =
(item.width || 300)+"px";

img.style.height="auto";

img.style.border =
"none";

img.style.cursor =
"move";

wrapper.appendChild(img);

element = wrapper;

}

if(item.type==="embed"){

const wrapper =
document.createElement("div");

wrapper.style.display = "inline-block";
wrapper.style.lineHeight = "0";
wrapper.style.cursor = "move";

wrapper.style.width =
(item.width || 600) + "px";

wrapper.style.height =
(item.height || 400) + "px";

const iframe =
document.createElement("iframe");

iframe.src =
item.url;

iframe.width = "100%";
iframe.height = "100%";

iframe.allow =
"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";

iframe.allowFullscreen = true;

iframe.style.border =
"2px solid red";

iframe.style.pointerEvents =
"none";

wrapper.appendChild(iframe);

element = wrapper;

}

if(!element) return;


if(item.visible === false){

element.style.opacity = "0.2";

}

if(selectedId===item.id && !redimensionando){

element.classList.add("selected");
  
if(item.type==="text"){

document.getElementById("color").value =
item.color || "#ff0000";

}  

} 

if(
selectedId===item.id &&
!redimensionando &&
(
item.type==="text" ||
item.type==="image" ||
item.type==="gif" ||
item.type==="embed"
)
){

const resizeHandle =
document.createElement("div");
  
resizeHandle.style.position = "absolute";
resizeHandle.style.width = "18px";
resizeHandle.style.height = "18px";
resizeHandle.style.right = "-12px";
resizeHandle.style.bottom = "-12px";
resizeHandle.style.background = "#00aaff";
resizeHandle.style.border = "2px solid white";
resizeHandle.style.borderRadius = "50%";
resizeHandle.style.cursor = "nwse-resize";
resizeHandle.style.zIndex = "9999";

element.appendChild(resizeHandle);

let ultimoGuardado = 0;

resizeHandle.onmousedown = (e)=>{

redimensionando = true;

e.stopPropagation();

const startX = e.clientX; 
const startY = e.clientY;

const startWidth =
item.width || 300;

const startSize =
item.size || 72;

const startRotation =
item.rotation || 0;  

function resize(ev){

const dx =
ev.clientX - startX;

const dy =
ev.clientY - startY;

if(
item.type==="image" ||
item.type==="gif" ||
item.type==="embed"
){

const nuevoAncho =
Math.max(
50,
startWidth + dx
);

const diferencia =
nuevoAncho - item.width;

item.x =
item.x - (diferencia / 2);

item.width =
nuevoAncho;

const img =
element.querySelector("img");

if(img){

img.style.width =
item.width + "px";

element.style.width =
item.width + "px";

element.style.height =
img.offsetHeight + "px";

}

element.style.left =
item.x + "px";  

item.rotation =
(startRotation || 0) + (dy * 0.5);

element.style.transform =
"rotate(" +
item.rotation +
"deg)";
  
}

if(item.type==="text"){

const nuevoSize =
Math.max(
10,
startSize + dx / 2
);

const anchoAnterior =
element.offsetWidth;

const altoAnterior =
element.offsetHeight;

item.size =
nuevoSize;

element.style.fontSize =
item.size + "px";

const anchoNuevo =
element.offsetWidth;

const altoNuevo =
element.offsetHeight;

item.x =
item.x - ((anchoNuevo - anchoAnterior) / 2);

item.y =
item.y - ((altoNuevo - altoAnterior) / 2);

element.style.fontSize =
item.size + "px";

element.style.left =
item.x + "px";

element.style.top =
item.y + "px";  

item.rotation =
(startRotation || 0) + (dy * 0.5);

element.style.transform =
"rotate(" +
item.rotation +
"deg)";  

}

const ahora = Date.now();

if(ahora - ultimoGuardado > 50){

ultimoGuardado = ahora;

guardar();

}

}
  
async function stopResize(){

document.removeEventListener(
"mousemove",
resize
);

document.removeEventListener(
"mouseup",
stopResize
);

redimensionando = false;

await guardar();

}

document.addEventListener(
"mousemove",
resize
);

document.addEventListener(
"mouseup",
stopResize
);

};

}  
  
element.style.position="absolute";
element.style.position = "absolute";
element.style.zIndex = "10";
element.style.left = item.x + "px";
element.style.top = item.y + "px";
element.style.overflow="visible";
element.style.transformOrigin = "center center";
element.style.transform =
"rotate(" +
(item.rotation || 0) +
"deg)";

if(item.type==="text"){

element.ondblclick=async ()=>{

const nuevo=
prompt("Texto",item.text);

if(nuevo!==null){

item.text=nuevo;

await guardar();

}

};

}

let startX,startY,startLeft,startTop;

element.onmousedown=(e)=>{

e.preventDefault();
e.stopPropagation();
  
selectedId=item.id; 

canvas.querySelectorAll(".selected")
.forEach(el => el.classList.remove("selected"));

element.classList.add("selected");

moviendo = true;

startX =
e.clientX / EDITOR_SCALE;

startY =
e.clientY / EDITOR_SCALE;

startLeft=item.x;
startTop=item.y;  

let huboMovimiento = false;  
  
function move(ev){

huboMovimiento = true;  

item.x =
startLeft +
((ev.clientX / EDITOR_SCALE) - startX);

item.y =
startTop +
((ev.clientY / EDITOR_SCALE) - startY);

element.style.left=
item.x+"px";

element.style.top=
item.y+"px";

const ahora = Date.now();

if(!window.ultimoGuardadoMove){
window.ultimoGuardadoMove = 0;
}

if(ahora - window.ultimoGuardadoMove > 50){

window.ultimoGuardadoMove = ahora;

guardar();  

}

}

async function stop(){

document.removeEventListener(
"mousemove",
move
);

document.removeEventListener(
"mouseup",
stop
);

moviendo = false;

element.style.position = "absolute";
element.style.zIndex = "10";

if(huboMovimiento){
    await guardar();
}

}

document.addEventListener(
"mousemove",
move
);

document.addEventListener(
"mouseup",
stop
);

};  

canvas.appendChild(element);

});

}

async function actualizarDirecto() {

  try {

    const response =
      await fetch("/api/live");

    const data =
      await response.json();

    if (
      !data.live ||
      !data.videoId
    ) {
      return;
    }

    const frame =
      document.getElementById(
        "youtubeFrame"
      );

    const nuevaUrl =
      `https://www.youtube.com/embed/${data.videoId}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&disablekb=1`;

    frame.src = nuevaUrl;

    console.log("VIDEO ID:", data.videoId);
console.log("URL:", nuevaUrl);

  } catch(err) {

    console.error(err);

  }

}

actualizarDirecto();

  
</script>


  
</body>
</html>
