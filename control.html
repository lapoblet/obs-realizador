<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Panel del Realizador</title>

<style>
body{
    font-family:Arial;
    padding:20px;
}

input[type=text]{
    width:400px;
    padding:10px;
}

button{
    padding:10px 20px;
    cursor:pointer;
}

.control{
    margin-bottom:15px;
}
</style>

</head>

<body>

<h1>Panel del realizador</h1>

<div class="control">
    <input
    id="texto"
    type="text"
    placeholder="Escribe un texto">
</div>

<div class="control">
    Color:
    <input
    type="color"
    id="color"
    value="#ff0000">
</div>

<div class="control">
    Tamaño:
    <input
    type="range"
    id="size"
    min="20"
    max="300"
    value="72">
</div>

<div class="control">
    <button onclick="enviar()">
        Actualizar texto
    </button>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {
getFirestore,
doc,
setDoc
}
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzJT8QDjb7nBjvN_YGWTXUUI3zU__lfdk",
  authDomain: "obs-realizador.firebaseapp.com",
  projectId: "obs-realizador",
  storageBucket: "obs-realizador.firebasestorage.app",
  messagingSenderId: "1034928961680",
  appId: "1:1034928961680:web:3c785128a4b33a61c2c015"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.enviar = async () => {

const texto =
document.getElementById("texto").value;

const color =
document.getElementById("color").value;

const size =
Number(document.getElementById("size").value);

await setDoc(
doc(db,"overlay","main"),
{
texto,
color,
size
}
);

};


</script>

</body>
</html>
