<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Panel del Realizador</title>

<style>

body{
margin:0;
font-family:Arial;
}

.toolbar{
padding:10px;
background:#222;
color:white;
}

button{
padding:10px;
margin-right:10px;
}

#canvas{
height:calc(100vh - 60px);
background:#f5f5f5;
position:relative;
overflow:hidden;
}

.text-item{
position:absolute;
cursor:move;
font-weight:bold;
user-select:none;
}

.selected{
outline:2px dashed #00aaff;
}

</style>

</head>

<body>

<div class="toolbar">

<button id="nuevoTexto">
+ Texto
</button>

<button id="nuevaImagen">
+ Imagen
</button>

<button id="eliminarElemento">
🗑 Eliminar
</button>

<input type="color" id="color" value="#ff0000">

<input type="range"
id="size"
min="20"
max="200"
value="72">

<input type="range"
id="imgWidth"
min="50"
max="1000"
value="300">
  
</div>

<div id="canvas"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {
getFirestore,
doc,
setDoc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAzJT8QDjb7nBjvN_YGWTXUUI3zU__lfdk",
authDomain: "obs-realizador.firebaseapp.com",
projectId: "obs-realizador",
storageBucket: "obs-realizador.firebasestorage.app",
messagingSenderId: "1034928961680",
appId: "1:1034928961680:web:3c785128a4b33a61c2c015"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let items=[];
let selectedId=null;

const canvas =
document.getElementById("canvas");

async function guardar(){

await setDoc(
doc(db,"overlay","main"),
{
items
}
);

}

document.getElementById("nuevoTexto")
.onclick = async ()=>{

const id =
Date.now().toString();

items.push({
id,
type:"text",
text:"Nuevo texto",
x:100,
y:100,
size:72,
color:"#ff0000"
});

selectedId=id;

await guardar();

};

document.getElementById("nuevaImagen")
.onclick = async ()=>{

const url =
prompt("Pega la URL de la imagen");

if(!url) return;

const id =
Date.now().toString();

items.push({
id,
type:"image",
url:url,
x:200,
y:200,
width:300
});

selectedId=id;

await guardar();

};

document.getElementById("eliminarElemento")
.onclick = async ()=>{

if(!selectedId) return;

items = items.filter(
item => item.id !== selectedId
);

selectedId = null;

await guardar();

};

document.getElementById("color")
.oninput = async (e)=>{

if(!selectedId) return;

const item =
items.find(i=>i.id===selectedId);

if(item.type!=="text") return;

item.color=e.target.value;

await guardar();

};


document.getElementById("size")
.oninput = async (e)=>{

document.getElementById("imgWidth")
.oninput = async (e)=>{

if(!selectedId) return;

const item =
items.find(i => i.id === selectedId);

if(item.type!=="image") return;

item.width =
Number(e.target.value);

await guardar();

};

};

onSnapshot(
doc(db,"overlay","main"),
(snapshot)=>{

const data =
snapshot.data();

if(!data) return;

items =
data.items || [];

render();

}
);

function render(){

canvas.innerHTML="";

canvas.style.background="#f5f5f5";

items.forEach(item=>{

let element;

if(item.type==="text"){

element =
document.createElement("div");

element.className="text-item";

element.style.background =
"rgba(255,255,255,0.4)";
  
element.innerText=item.text;

element.style.color=item.color;

element.style.fontSize=item.size+"px";

}

if(item.type==="image"){

element =
document.createElement("img");

element.src=item.url;

element.style.width =
(item.width || 300)+"px";

element.style.height="auto";

element.style.border =
"2px solid #00aaff";

element.style.cursor =
"move";

}

if(!element) return;

if(selectedId===item.id){

element.classList.add("selected");

if(item.type==="text"){

document.getElementById("color").value =
item.color || "#ff0000";

document.getElementById("size").value =
item.size || 72;

}

if(item.type==="image"){

document.getElementById("imgWidth").value =
item.width || 300;

}

}

element.style.position="absolute";
element.style.left=item.x+"px";
element.style.top=item.y+"px";

element.onclick=()=>{

selectedId=item.id;

render();

};

if(item.type==="text"){

element.ondblclick=async ()=>{

const nuevo=
prompt("Texto",item.text);

if(nuevo!==null){

item.text=nuevo;

await guardar();

}

};

}

let startX,startY,startLeft,startTop;

element.onmousedown=(e)=>{

selectedId=item.id;

startX=e.clientX;
startY=e.clientY;

startLeft=item.x;
startTop=item.y;

function move(ev){

item.x=
startLeft+(ev.clientX-startX);

item.y=
startTop+(ev.clientY-startY);

element.style.left=
item.x+"px";

element.style.top=
item.y+"px";

}

async function stop(){

document.removeEventListener(
"mousemove",
move
);

document.removeEventListener(
"mouseup",
stop
);

await guardar();

}

document.addEventListener(
"mousemove",
move
);

document.addEventListener(
"mouseup",
stop
);

};

canvas.appendChild(element);

});

}

</script>

</body>
</html>
