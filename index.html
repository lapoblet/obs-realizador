<!DOCTYPE html>
<html>
<head>

<style>

html,body{
margin:0;
width:100%;
height:100%;
background:transparent;
overflow:hidden;
}

#overlay{
width:100%;
height:100%;
position:relative;
}

.text-item{
position:absolute;
font-family:Arial;
font-weight:bold;
pointer-events:none;
}

</style>

</head>

<body>

<div id="overlay"></div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabaseUrl =
"https://dzbxgfxtdijdzrfophow.supabase.co";

const supabaseKey =
"sb_publishable_w--FJvX0mYUZoeraWkQkUg_xAF8e5tR";

const supabase =
createClient(
supabaseUrl,
supabaseKey
);

const elementos = new Map();
  
async function cargar(){

const { data, error } =
await supabase
.from("overlay")
.select("*")
.eq("id","main")
.single();

if(error){
console.error(error);
return;
}

const overlay =
document.getElementById("overlay");

const items =
data.data.items || [];

const idsActuales = new Set();

items.forEach(item=>{

if(item.visible === false){
return;
}

idsActuales.add(item.id);

let el = elementos.get(item.id);

if(!el){

if(item.type==="text"){

el = document.createElement("div");
el.className = "text-item";

}

else if(item.type==="image" || item.type==="gif"){

el = document.createElement("img");

}

else if(item.type==="video"){

el = document.createElement("video");

el.autoplay = true;
el.muted = true;
el.loop = true;
el.playsInline = true;

}

else if(item.type==="embed"){

el = document.createElement("iframe");

el.style.border = "none";

}

if(!el) return;

el.style.position = "absolute";

overlay.appendChild(el);

elementos.set(item.id, el);

}

if(item.type==="text"){

el.innerText =
item.text || "";

el.style.color =
item.color || "#ff0000";

el.style.fontSize =
(item.size || 72) + "px";

}

else if(item.type==="image" || item.type==="gif"){

if(el.src !== item.url){
el.src = item.url;
}

el.style.width =
(item.width || 300) + "px";

}

else if(item.type==="video"){

if(el.src !== item.url){
el.src = item.url;
}

el.style.width =
(item.width || 600) + "px";

}

else if(item.type==="embed"){

if(el.src !== item.url){
el.src = item.url;
}

el.width =
item.width || 600;

el.height =
item.height || 400;

}

el.style.left =
(item.x || 0) + "px";

el.style.top =
(item.y || 0) + "px";

el.style.transformOrigin =
"center center";

el.style.transform =
"rotate(" +
(item.rotation || 0) +
"deg)";

});

for(const [id, el] of elementos){

if(!idsActuales.has(id)){

el.remove();

elementos.delete(id);

}

}

}
  
cargar();

const channel = supabase
.channel('overlay-changes')
.on(
'postgres_changes',
{
event: 'UPDATE',
schema: 'public',
table: 'overlay'
},
() => {

cargar();

}
)
.subscribe();
  
</script>

</body>
</html>
