<!DOCTYPE html>
<html>
<head>

<style>

html,body{
margin:0;
width:100%;
height:100%;
background:transparent;
overflow:hidden;
}

#overlay{
width:100%;
height:100%;
position:relative;
}

.text-item{
position:absolute;
font-family:Arial;
font-weight:bold;
pointer-events:none;
}

</style>

</head>

<body>

<div id="overlay"></div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabaseUrl =
"https://dzbxgfxtdijdzrfophow.supabase.co";

const supabaseKey =
"sb_publishable_w--FJvX0mYUZoeraWkQkUg_xAF8e5tR";

const supabase =
createClient(
supabaseUrl,
supabaseKey
);

async function cargar(){

const { data, error } =
await supabase
.from("overlay")
.select("*")
.eq("id","main")
.single();

if(error){
console.error(error);
return;
}

const overlay =
document.getElementById("overlay");

overlay.innerHTML="";

const items =
data.data.items || [];

items.forEach(item=>{

if(item.visible === false){
return;
}

if(item.type==="text"){

const div =
document.createElement("div");

div.className="text-item";

div.innerText =
item.text || "";

div.style.left =
(item.x || 100)+"px";

div.style.top =
(item.y || 100)+"px";

div.style.color =
item.color || "#ff0000";

div.style.fontSize =
(item.size || 72)+"px";

div.style.transformOrigin =
"center center";

div.style.transform =
"rotate(" +
(item.rotation || 0) +
"deg)";

overlay.appendChild(div);

}

if(item.type==="image"){

const img =
document.createElement("img");

img.src =
item.url;

img.style.position =
"absolute";

img.style.left =
(item.x || 200)+"px";

img.style.top =
(item.y || 200)+"px";

img.style.width =
(item.width || 300)+"px";

img.style.transformOrigin =
"center center";

img.style.transform =
"rotate(" +
(item.rotation || 0) +
"deg)";

overlay.appendChild(img);

}

if(item.type==="gif"){

const img =
document.createElement("img");

img.src =
item.url;

img.style.position =
"absolute";

img.style.left =
(item.x || 200) + "px";

img.style.top =
(item.y || 200) + "px";

img.style.width =
(item.width || 300) + "px";

img.style.transformOrigin =
"center center";

img.style.transform =
"rotate(" +
(item.rotation || 0) +
"deg)";

overlay.appendChild(img);

}

if(item.type==="video"){

const video =
document.createElement("video");

video.src =
item.url;

video.autoplay = true;
video.muted = true;
video.loop = true;
video.playsInline = true;

video.style.position =
"absolute";

video.style.left =
(item.x || 200) + "px";

video.style.top =
(item.y || 200) + "px";

video.style.width =
(item.width || 600) + "px";

video.style.transformOrigin =
"center center";

video.style.transform =
"rotate(" +
(item.rotation || 0) +
"deg)";

overlay.appendChild(video);

}

if(item.type==="embed"){

const iframe =
document.createElement("iframe");

iframe.src =
item.url;

iframe.style.position =
"absolute";

iframe.style.left =
(item.x || 200) + "px";

iframe.style.top =
(item.y || 200) + "px";

iframe.width =
item.width || 600;

iframe.height =
item.height || 400;

iframe.style.border =
"none";

iframe.style.transformOrigin =
"center center";

iframe.style.transform =
"rotate(" +
(item.rotation || 0) +
"deg)";

overlay.appendChild(iframe);

}

});

}

cargar();

setInterval(cargar,1000);

</script>

</body>
</html>
