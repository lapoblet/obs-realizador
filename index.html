<!DOCTYPE html>
<html>
<head>

<style>

html,body{
margin:0;
width:100%;
height:100%;
background:transparent;
overflow:hidden;
}

#overlay{
width:100%;
height:100%;
position:relative;
}

.text-item{
position:absolute;
font-family:Arial;
font-weight:bold;
pointer-events:none;
}

</style>

</head>

<body>

<div id="overlay"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {
getFirestore,
doc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAzJT8QDjb7nBjvN_YGWTXUUI3zU__lfdk",
authDomain: "obs-realizador.firebaseapp.com",
projectId: "obs-realizador",
storageBucket: "obs-realizador.firebasestorage.app",
messagingSenderId: "1034928961680",
appId: "1:1034928961680:web:3c785128a4b33a61c2c015"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

onSnapshot(
doc(db,"overlay","main"),
(snapshot)=>{

const data =
snapshot.data();

const overlay =
document.getElementById("overlay");

overlay.innerHTML="";

if(!data) return;

const items =
data.items || [];

items.forEach(item=>{

if(item.type==="text"){

const div =
document.createElement("div");

div.className="text-item";

div.innerText =
item.text || "";

div.style.left =
(item.x || 100)+"px";

div.style.top =
(item.y || 100)+"px";

div.style.color =
item.color || "#ff0000";

div.style.fontSize =
(item.size || 72)+"px";

overlay.appendChild(div);

}

if(item.type==="image"){

const img =
document.createElement("img");

img.src =
item.url;

img.style.position =
"absolute";

img.style.left =
(item.x || 200)+"px";

img.style.top =
(item.y || 200)+"px";

img.style.width =
(item.width || 300)+"px";

overlay.appendChild(img);

}

if(item.type==="gif"){

const img =
document.createElement("img");

img.src =
item.url;

img.style.position =
"absolute";

img.style.left =
(item.x || 200) + "px";

img.style.top =
(item.y || 200) + "px";

img.style.width =
(item.width || 300) + "px";

overlay.appendChild(img);

}  

});

}
);

</script>

</body>
</html>
