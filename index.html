<!DOCTYPE html>
<html>
<head>

<style>

html,body{
margin:0;
width:100%;
height:100%;
background:transparent;
overflow:hidden;
}

#texto{
position:absolute;
top:100px;
left:100px;
font-size:72px;
font-family:Arial;
color:red;
font-weight:bold;
}

</style>

</head>

<body>

<div id="texto"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {
getFirestore,
doc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAzJT8QDjb7nBjvN_YGWTXUUI3zU__lfdk",
authDomain: "obs-realizador.firebaseapp.com",
projectId: "obs-realizador",
storageBucket: "obs-realizador.firebasestorage.app",
messagingSenderId: "1034928961680",
appId: "1:1034928961680:web:3c785128a4b33a61c2c015"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

onSnapshot(
doc(db,"overlay","main"),
(snapshot)=>{

const data=snapshot.data();

if(data){

const texto =
document.getElementById("texto");

texto.innerText =
data.texto || "";

texto.style.color =
data.color || "red";

texto.style.fontSize =
(data.size || 72) + "px";

texto.style.left =
(data.x || 100) + "px";

texto.style.top =
(data.y || 100) + "px";

}

</script>

</body>
</html>
