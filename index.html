<!DOCTYPE html>
<html>
<head>

<style>

html,body{
margin:0;
width:100%;
height:100%;
background:transparent;
overflow:hidden;
}

#overlay{
width:100%;
height:100%;
position:relative;
}

.text-item{
position:absolute;
font-family:Arial;
font-weight:bold;
pointer-events:none;
white-space:nowrap;  
}

#drawLayer{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
pointer-events:none;
z-index:100000;  
}
  
</style>

</head>

<body>

<div id="overlay"></div>

<canvas id="drawLayer"></canvas>  

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabaseUrl =
"https://dzbxgfxtdijdzrfophow.supabase.co";

const supabaseKey =
"sb_publishable_w--FJvX0mYUZoeraWkQkUg_xAF8e5tR";

const supabase =
createClient(
supabaseUrl,
supabaseKey
);

const elementos = new Map();

const videoFrames = new Map();
  
const lastCommands = new Map();  

const drawLayer =
document.getElementById("drawLayer");

drawLayer.width = 1920;
drawLayer.height = 1080;

const drawCtx =
drawLayer.getContext("2d");

function pintarDibujo(c, datos){

c.clearRect(0, 0, c.canvas.width, c.canvas.height);

let t = [];

function cerrar(){

if(t.length >= 2){

const p0 = t[0];

c.globalCompositeOperation =
p0.color === "eraser" ? "destination-out" : "source-over";

c.strokeStyle = p0.color === "eraser" ? "#000" : p0.color;
c.lineWidth = p0.size;
c.lineCap = "round";
c.lineJoin = "round";

c.beginPath();
c.moveTo(t[0].x, t[0].y);
c.lineTo((t[0].x + t[1].x) / 2, (t[0].y + t[1].y) / 2);

for(let i = 1; i < t.length - 1; i++){
c.quadraticCurveTo(
t[i].x, t[i].y,
(t[i].x + t[i+1].x) / 2, (t[i].y + t[i+1].y) / 2
);
}

c.lineTo(t[t.length - 1].x, t[t.length - 1].y);
c.stroke();

}

t = [];

}

datos.forEach(p=>{

if(p.newStroke){
cerrar();
return;
}

t.push(p);

});

cerrar();

}  

function comandoTikTok(iframe, accion){

if(!iframe || !iframe.contentWindow) return;

function enviar(type, value){

const msg = { type: type, "x-tiktok-player": true };

if(value !== undefined) msg.value = value;

iframe.contentWindow.postMessage(msg, "*");

}

if(accion === "play") enviar("play");

if(accion === "pause") enviar("pause");

if(accion === "restart"){

enviar("seekTo", 0);

enviar("play");

}

}  

window.addEventListener("message",(e)=>{

const m = e.data;

if(!m || m["x-tiktok-player"] !== true) return;

if(m.type !== "onStateChange" || m.value !== 2) return;

for(const [id, el] of elementos){

if(
el.dataset.tiktok === "1" &&
el.dataset.calentado !== "1" &&
el.contentWindow === e.source
){

el.dataset.calentado = "1";

el.contentWindow.postMessage(
{ type:"seekTo", value:0, "x-tiktok-player":true },
"*"
);

if(el.dataset.oculto !== "1"){
el.style.visibility = "visible";
}

}

}

});
  
async function cargar(datos){

let contenido = datos;

if(!contenido){

const { data, error } =
await supabase
.from("overlay")
.select("*")
.eq("id","main")
.single();

if(error){
console.error(error);
return;
}

contenido = data.data;

}

const overlay =
document.getElementById("overlay");

const items =
contenido.items || [];

const drawData =
contenido.drawData || [];  

pintarDibujo(drawCtx, drawData);
  
const idsActuales = new Set();

items.forEach(item=>{

if(item.visible === false){

if(item.type === "embed" && elementos.has(item.id)){

idsActuales.add(item.id);

const elOculto = elementos.get(item.id);

elOculto.style.visibility = "hidden";

if(elOculto.dataset.oculto !== "1"){

elOculto.dataset.oculto = "1";

if(item.platform === "tiktok"){

comandoTikTok(elOculto, "pause");

}  

elOculto.contentWindow.postMessage(
JSON.stringify({
event:"command",
func:"pauseVideo",
args:[]
}),
"*"
);

}

}

return;

}

idsActuales.add(item.id);

let el = elementos.get(item.id);

if(!el){

if(item.type==="text"){

el = document.createElement("div");
el.className = "text-item";

}

else if(item.type==="image" || item.type==="gif"){

el = document.createElement("img");

}

else if(item.type==="video"){

el = document.createElement("video");

el.autoplay = true;
el.muted = true;
el.loop = true;
el.playsInline = true;

}

else if(item.type==="embed"){

el = document.createElement("iframe");

el.style.border = "none";

el.allow = "autoplay; fullscreen; encrypted-media";  

if(item.platform === "tiktok"){

el.dataset.tiktok = "1";

el.style.visibility = "hidden";

let intentos = 0;

const insistir = setInterval(()=>{

intentos++;

if(el.dataset.calentado === "1" || !el.isConnected || intentos > 24){

clearInterval(insistir);

if(el.isConnected && el.dataset.calentado !== "1"){

el.dataset.calentado = "1";

if(el.dataset.oculto !== "1"){
el.style.visibility = "visible";
}

}

return;

}

comandoTikTok(el, "pause");

}, 500);

}

}

if(!el) return;

el.style.position = "absolute";

overlay.appendChild(el);

elementos.set(item.id, el);

}

if(item.type==="text"){

el.innerText =
item.text || "";

el.style.color =
item.color || "#ff0000";

el.style.fontSize =
(item.size || 72) + "px";

}

else if(item.type==="image" || item.type==="gif"){

if(el.dataset.url !== item.url){ el.dataset.url = item.url; el.src = item.url; }

el.style.width =
(item.width || 300) + "px";

}

else if(item.type==="video"){

if(el.dataset.url !== item.url){ el.dataset.url = item.url; el.src = item.url; }

el.style.width =
(item.width || 600) + "px";

}

else if(item.type==="embed"){

if(el.dataset.url !== item.url){ el.dataset.url = item.url; el.src = item.url; }

el.width =
item.width || 600;

el.height =
item.height || 400;

videoFrames.set(
    item.id,
    el
);

if(
    item.commandId &&
    lastCommands.get(item.id) !== item.commandId
){

    lastCommands.set(
        item.id,
        item.commandId
    );

  if(item.platform === "tiktok"){

comandoTikTok(el, item.playerState);

}

    if(item.playerState === "play"){

        el.contentWindow.postMessage(
            JSON.stringify({
                event:"command",
                func:"playVideo",
                args:[]
            }),
            "*"
        );

    }

    if(item.playerState === "pause"){

        el.contentWindow.postMessage(
            JSON.stringify({
                event:"command",
                func:"pauseVideo",
                args:[]
            }),
            "*"
        );

    }

    if(item.playerState === "restart"){

        el.contentWindow.postMessage(
            JSON.stringify({
                event:"command",
                func:"seekTo",
                args:[0,true]
            }),
            "*"
        );

        el.contentWindow.postMessage(
            JSON.stringify({
                event:"command",
                func:"playVideo",
                args:[]
            }),
            "*"
        );

    }

}

}

if(
el.dataset.oculto === "1" &&
(item.playerState === "play" || item.playerState === "restart")
){

el.contentWindow.postMessage(
JSON.stringify({
event:"command",
func:"playVideo",
args:[]
}),
"*"
);

}

if(el.dataset.tiktok !== "1" || el.dataset.calentado === "1"){
el.style.visibility = "visible";
}

el.dataset.oculto = "0";

el.style.zIndex = String(1000 + (item.z || 0));  
  
el.style.left =
((item.x || 0) - 190) + "px";

el.style.top =
((item.y || 0) - 160) + "px";

el.style.transformOrigin =
"center center";

el.style.transform =
"rotate(" +
(item.rotation || 0) +
"deg)";

});

for(const [id, el] of elementos){

if(!idsActuales.has(id)){

el.remove();

elementos.delete(id);

}

}

}
  
cargar();

const channel = supabase
.channel('overlay-changes')
.on(
'postgres_changes',
{
event: 'UPDATE',
schema: 'public',
table: 'overlay'
},
(payload) => {

cargar(payload.new?.data);

}
)
.subscribe();
  
</script>

</body>
</html>
