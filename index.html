<!DOCTYPE html>
<html>
<head>

<style>

html,body{
margin:0;
width:100%;
height:100%;
background:transparent;
overflow:hidden;
}

#overlay{
width:100%;
height:100%;
position:relative;
}

.text-item{
position:absolute;
font-family:Arial;
font-weight:bold;
pointer-events:none;
}

#drawLayer{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
pointer-events:none;
}
  
</style>

</head>

<body>

<div id="overlay"></div>

<canvas id="drawLayer"></canvas>  

<script src="https://www.youtube.com/iframe_api"></script>  

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabaseUrl =
"https://dzbxgfxtdijdzrfophow.supabase.co";

const supabaseKey =
"sb_publishable_w--FJvX0mYUZoeraWkQkUg_xAF8e5tR";

const supabase =
createClient(
supabaseUrl,
supabaseKey
);

const elementos = new Map();

const players = new Map();  

const playersReady = new Map();  

const drawLayer =
document.getElementById("drawLayer");

drawLayer.width = 1920;
drawLayer.height = 1080;

const drawCtx =
drawLayer.getContext("2d");
  
async function cargar(){

const { data, error } =
await supabase
.from("overlay")
.select("*")
.eq("id","main")
.single();

if(error){
console.error(error);
return;
}

const overlay =
document.getElementById("overlay");

const items =
data.data.items || [];

console.log(items);  

const drawData =
data.data.drawData || [];  

drawCtx.clearRect(
0,
0,
drawLayer.width,
drawLayer.height
);

let lastPoint = null;

drawData.forEach(point=>{

if(point.newStroke){

lastPoint = null;

return;

}

if(!lastPoint){

lastPoint = point;

drawCtx.globalCompositeOperation =
point.color === "eraser"
? "destination-out"
: "source-over";

drawCtx.beginPath();

drawCtx.moveTo(
point.x,
point.y
);

return;

}

if(point.color === "eraser"){

drawCtx.globalCompositeOperation =
"destination-out";

}else{

drawCtx.globalCompositeOperation =
"source-over";

drawCtx.strokeStyle =
point.color;

}

drawCtx.lineWidth =
point.size;

drawCtx.lineCap = "round";
drawCtx.lineJoin = "round";

drawCtx.beginPath();

drawCtx.moveTo(
lastPoint.x,
lastPoint.y
);

drawCtx.lineTo(
point.x,
point.y
);

drawCtx.stroke();

lastPoint = point;

});
const idsActuales = new Set();

items.forEach(item=>{

console.log(
    "ITEM",
    item.id,
    item.type,
    item.playerState
);  

if(item.visible === false){
return;
}

idsActuales.add(item.id);

let el = elementos.get(item.id);

if(!el){

if(item.type==="text"){

el = document.createElement("div");
el.className = "text-item";

}

else if(item.type==="image" || item.type==="gif"){

el = document.createElement("img");

}

else if(item.type==="video"){

el = document.createElement("video");

el.autoplay = true;
el.muted = true;
el.loop = true;
el.playsInline = true;

}

else if(item.type==="embed"){

    el = document.createElement("div");

    el.style.border = "none";

}

  overlay.appendChild(el);

if(!el) return;

el.style.position = "absolute";

overlay.appendChild(el);

elementos.set(item.id, el);

}

if(item.type==="text"){

el.innerText =
item.text || "";

el.style.color =
item.color || "#ff0000";

el.style.fontSize =
(item.size || 72) + "px";

}

else if(item.type==="image" || item.type==="gif"){

if(el.src !== item.url){
el.src = item.url;
}

el.style.width =
(item.width || 300) + "px";

}

else if(item.type==="video"){

if(el.src !== item.url){
el.src = item.url;
}

el.style.width =
(item.width || 600) + "px";

}

else if(item.type==="embed"){

    if(!players.has(item.id)){

      alert("Creando player");

        const videoId =
        item.url
        .split("/embed/")[1]
        .split("?")[0];

const player =
new YT.Player(el,{

    videoId: videoId,

playerVars:{
    autoplay:0,
    controls:0,
    playsinline:1,
    enablejsapi:1
},

events:{
    onReady:function(event){

        playersReady.set(
            item.id,
            true
        );

        event.target.pauseVideo();

    }
}


});

        players.set(
            item.id,
            player
        );

    }

    const player =
    players.get(item.id);

  if(
    player &&
    playersReady.get(item.id)
){

       if(item.playerState === "play"){

    try{
        player.playVideo();
    }catch(e){}

}
    if(item.playerState === "pause"){

    try{
        player.pauseVideo();
    }catch(e){}

}
    if(item.playerState === "restart"){

    try{

        player.seekTo(0);

        player.playVideo();

    }catch(e){}

}

    }

    el.style.width =
    (item.width || 600) + "px";

    el.style.height =
    (item.height || 400) + "px";

}
el.style.left =
((item.x || 0) - 190) + "px";

el.style.top =
((item.y || 0) - 160) + "px";

el.style.transformOrigin =
"center center";

el.style.transform =
"rotate(" +
(item.rotation || 0) +
"deg)";

});

for(const [id, el] of elementos){

if(!idsActuales.has(id)){

el.remove();

elementos.delete(id);

}

}

}
  
cargar();

const channel = supabase
.channel('overlay-changes')
.on(
'postgres_changes',
{
event: 'UPDATE',
schema: 'public',
table: 'overlay'
},
() => {

cargar();

}
)
.subscribe();
  
</script>

</body>
</html>
